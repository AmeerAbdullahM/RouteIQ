server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:routeiqdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false

routeiq:
  jwt:
    secret: ${AUTHENTICATION_SECRET:supersecretkeythatshouldbeatleast32characterslong}
    expiration-ms: 86400000
  providers:
    routing:
      type: ${ROUTING_PROVIDER:osrm}
      base-url: ${ROUTING_BASE_URL:http://router.project-osrm.org}
    geocoding:
      type: ${GEOCODING_PROVIDER:nominatim}
      base-url: ${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
    traffic:
      type: ${TRAFFIC_PROVIDER:simulated}
      api-key: ${TRAFFIC_API_KEY:}
